name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to catch examples broken by upstream package changes

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      solutions: ${{ steps.find.outputs.solutions }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          list=$(find examples -maxdepth 2 \( -name '*.sln' -o -name '*.slnx' \) | sort | jq -R -s -c 'split("\n")[:-1]')
          echo "solutions=$list" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        solution: ${{ fromJson(needs.discover.outputs.solutions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test with coverage
        run: >
          dotnet test "${{ matrix.solution }}" --nologo
          --collect:"XPlat Code Coverage"
          --results-directory "$RUNNER_TEMP/TestResults"
      - name: Build coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.1
          reportgenerator \
            -reports:"$RUNNER_TEMP/TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage \
            -reporttypes:"MarkdownSummaryGithub;Html" \
            -assemblyfilters:"-*.Tests"
      - name: Publish coverage summary
        id: summary
        if: always()
        run: |
          name=$(basename "$(dirname "${{ matrix.solution }}")")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "## Coverage: $name" >> "$GITHUB_STEP_SUMMARY"
          cat coverage/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ steps.summary.outputs.name }}
          path: coverage
          retention-days: 14
